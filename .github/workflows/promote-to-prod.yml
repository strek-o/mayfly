name: Promote to prod

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Commit SHA of the image to promote (already deployed to dev)
        type: string
        required: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      IMAGE_TAG: ${{ inputs.image_tag }}

    steps:
      - name: Require main branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Promotion must run from main, not $GITHUB_REF"
          exit 1

      - name: Validate image tag format
        run: |
          if [[ ! "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::image_tag must be a full 40-character commit SHA"
            exit 1
          fi

  deploy-prod:
    needs: validate
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      environment: prod
      image_tag: ${{ inputs.image_tag }}
