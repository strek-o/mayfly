name: Deploy

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      image_tag:
        type: string
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: infra/envs/${{ inputs.environment }}
    env:
      TF_IN_AUTOMATION: true
      TF_INPUT: false
      TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_image_tag: ${{ inputs.image_tag }}
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.image_tag }}
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.7
          terraform_wrapper: false

      - name: Sign in to Azure with OIDC
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform init
        run: terraform init

      - name: Terraform plan
        run: terraform plan -out=tfplan

      - name: Terraform apply
        run: terraform apply tfplan

      - name: Allow runner access to SQL
        id: sql-firewall
        run: |
          runner_ip="$(curl --fail --silent --show-error --max-time 10 https://api.ipify.org)"
          az sql server firewall-rule create \
            --resource-group "$(terraform output -raw resource_group_name)" \
            --server "$(terraform output -raw sql_server_name)" \
            --name github-actions-deploy \
            --start-ip-address "$runner_ip" \
            --end-ip-address "$runner_ip" \
            --output none

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Refresh Azure sign-in
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Read database settings
        id: sql
        run: |
          {
            echo "connection_string=Server=tcp:$(terraform output -raw sql_server_fqdn),1433;Initial Catalog=$(terraform output -raw sql_database_name);Authentication=Active Directory Default;Encrypt=True"
            echo "app_identity_name=$(terraform output -raw app_identity_name)"
            echo "app_identity_client_id=$(terraform output -raw app_identity_client_id)"
          } >> "$GITHUB_OUTPUT"

      - name: Apply database migrations
        working-directory: ${{ github.workspace }}
        env:
          CONNECTION_STRING: ${{ steps.sql.outputs.connection_string }}
        run: |
          dotnet tool restore
          dotnet build src/Mayfly.Web
          dotnet ef database update \
            --project src/Mayfly.Web \
            --no-build \
            --connection "$CONNECTION_STRING"

      - name: Grant app identity access to database
        uses: azure/sql-action@eb1f9a80487ca52b90f41a473f53da4943526994 # v2.4
        with:
          connection-string: ${{ steps.sql.outputs.connection_string }}
          path: infra/sql/app-user.sql
          arguments: >-
            -b
            -v AppIdentityName=${{ steps.sql.outputs.app_identity_name }}
            -v AppIdentityClientId=${{ steps.sql.outputs.app_identity_client_id }}
          skip-firewall-check: true

      - name: Check readiness endpoint
        run: |
          url="$(terraform output -raw app_url)/healthz/ready"
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error --max-time 10 "$url"; then
              echo
              echo "Healthy: $url"
              exit 0
            fi
            echo "Attempt $attempt failed, retrying in 10s"
            sleep 10
          done
          echo "::error::Health check failed for $url"
          exit 1

      - name: Remove runner access to SQL
        if: always() && steps.sql-firewall.outcome == 'success'
        run: |
          az sql server firewall-rule delete \
            --resource-group "$(terraform output -raw resource_group_name)" \
            --server "$(terraform output -raw sql_server_name)" \
            --name github-actions-deploy
